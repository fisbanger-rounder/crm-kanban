<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Modern CRM Kanban Board — Manage your sales pipeline, contacts, and analytics.">
  <title>CRM Kanban — Sales Pipeline</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══ Auth Loading Screen ═══ -->
  <div id="auth-loader">
    <div class="auth-loader-spinner"></div>
    <span class="auth-loader-text">Loading...</span>
  </div>

  <!-- ═══ Auth Screen (Login / Register) ═══ -->
  <div id="auth-screen">
    <!-- Rendered by auth.js -->
  </div>

  <!-- ═══ App Screen (Multi-View Layout) ═══ -->
  <div class="app-layout" id="app-screen">

    <!-- ═══ Sidebar ═══ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-icon">CK</div>
        <span class="brand-text">CRM Kanban</span>
      </div>

      <nav class="sidebar-nav">
        <span class="nav-section-label">Main</span>

        <div class="nav-item active" data-view="pipeline" id="nav-pipeline">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg>
          </span>
          <span class="nav-label">Pipeline</span>
        </div>

        <div class="nav-item" data-view="contacts" id="nav-contacts">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </span>
          <span class="nav-label">Contacts</span>
        </div>

        <div class="nav-item" data-view="analytics" id="nav-analytics">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          </span>
          <span class="nav-label">Analytics</span>
        </div>

        <span class="nav-section-label">System</span>

        <div class="nav-item" data-view="settings" id="nav-settings">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </span>
          <span class="nav-label">Settings</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-footer-content">
          <!-- User profile (rendered by auth.js) -->
          <div id="user-profile"></div>
          <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Toggle sidebar">
            <svg viewBox="0 0 24 24"><polyline points="11 17 6 12 11 7"></polyline><polyline points="18 17 13 12 18 7"></polyline></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ═══ Main Content ═══ -->
    <main class="main-content">

      <!-- ── Topbar ── -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
            <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <h1 class="topbar-title" id="page-title">Sales Pipeline</h1>
          <div class="topbar-stats" id="topbar-stats-chips">
            <div class="stat-chip">
              <span>Deals</span>
              <span class="stat-value" id="stat-total-deals">0</span>
            </div>
            <div class="stat-chip">
              <span>Value</span>
              <span class="stat-value" id="stat-total-value">$0</span>
            </div>
          </div>
        </div>
        <div class="topbar-right">
          <div class="search-box" id="topbar-search-box">
            <span class="search-icon">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
          </div>
          <button class="btn-add-deal" id="btn-add-deal">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Add Deal</span>
          </button>
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
            <!-- Icon injected by JS -->
          </button>
        </div>
      </header>

      <!-- ── Views Containers ── -->
      
      <!-- 1. Pipeline (Kanban) -->
      <div class="app-view active" id="view-pipeline">
        <div class="kanban-board" id="kanban-board">
          <!-- Columns rendered by JS -->
        </div>
      </div>

      <!-- 2. Contacts -->
      <div class="app-view" id="view-contacts">
        <div id="contacts-container"></div>
      </div>

      <!-- 3. Analytics -->
      <div class="app-view" id="view-analytics">
        <div id="analytics-container"></div>
      </div>

      <!-- 4. Settings -->
      <div class="app-view" id="view-settings">
        <div id="settings-container"></div>
      </div>

    </main>
  </div>

  <!-- ═══ Modal ═══ -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal-panel">
      <!-- Content rendered by JS -->
    </div>
  </div>

  <!-- ═══ Toast Container ═══ -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Supabase JS Client (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Scripts (order matters: config → store → kanban → modal → views → auth → app) -->
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/contacts.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
